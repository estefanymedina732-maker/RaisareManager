<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitaciones VIP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="topbar">

    <div class="container topbar-content">

        <img src="../assets/images/Color_Horizontal.png" class="logo">

        <div class="event-info">

            <h2>Pink Pony Club Party</h2>
            <p>Primer aniversario</p>

        </div>

    </div>

</header>

<main class="container-fluid mt-4">

    <div class="row">

        <!-- MENÚ -->

        <div class="col-lg-3">

            <div class="menu-card">

                <h4>Menú</h4>

                <a href="dashboard.html" class="menu-btn">
                    📊 Dashboard
                </a>

                <a href="boletos.html" class="menu-btn">
                    💳 Compras de Preventa
                </a>

                <a href="vip.html" class="menu-btn active">
                    ⭐ Invitaciones VIP
                </a>

                <a href="scanner.html" class="menu-btn">
                    📷 Check-In
                </a>

                <a href="reportes.html" class="menu-btn">
                    📈 Reportes
                </a>

                <a href="configuracion.html" class="menu-btn">
                    ⚙ Configuración
                </a>

            </div>

        </div>

        <!-- CONTENIDO -->

        <div class="col-lg-9">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="mb-0">
                    Invitaciones VIP
                </h2>

                <button
                    class="btn-raisare"
                    onclick="nuevoVIP()">

                    ⭐ Nueva Invitación

                </button>

            </div>

            <input
                id="buscadorVIP"
                class="form-control mb-4"
                type="text"
                placeholder="🔍 Buscar nombre, teléfono, Instagram o código VIP..."
            >

            <div class="card shadow-sm border-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                            <tr>

                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Instagram</th>
                                <th class="text-end">Acción</th>

                            </tr>

                        </thead>

                        <tbody id="tablaVIP">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- Modal Nuevo VIP -->

<div class="modal fade" id="modalVIP" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    ⭐ Nueva Invitación VIP
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        id="vipNombre"
                        type="text"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        id="vipTelefono"
                        type="text"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Instagram
                    </label>

                    <input
                        id="vipInstagram"
                        type="text"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Observaciones
                    </label>

                    <textarea
                        id="vipObservaciones"
                        class="form-control"
                        rows="3"></textarea>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

<button
    class="btn-raisare"
    onclick="crearNuevoVIP()">

    ⭐ Crear VIP

</button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/vip.js"></script>

</body>

</html>
