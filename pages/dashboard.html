<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="topbar">

    <div class="container topbar-content">

        <img src="../assets/images/Color_Horizontal.png"
             class="logo">

        <div class="event-info">

            <h2>Pink Pony Club Party</h2>

            <p>Primer aniversario</p>

        </div>

    </div>

</header>

<main class="container-fluid mt-4">

    <div class="row">

        <div class="col-lg-3">

            <div class="menu-card">

                <h4>Menú</h4>

                <a href="dashboard.html" class="menu-btn active">
                    📊 Dashboard
                </a>

                <a href="boletos.html" class="menu-btn">
                    💳 Compras de Preventa
                </a>

                <a href="scanner.html" class="menu-btn">
                    📷 Check-In
                </a>

                <a href="reportes.html" class="menu-btn">
                    📈 Reportes
                </a>

                <a href="configuracion.html" class="menu-btn">
                    ⚙ Configuración
                </a>

            </div>

        </div>

        <div class="col-lg-9">

            <h2 class="mb-4">
                Dashboard
            </h2>

            <div class="row g-4">

                <div class="col-md-6 col-lg-3">

                    <div class="dashboard-card">

                        <h3 id="totalBoletos">0</h3>

                        <p>Boletos de Preventa</p>

                    </div>

                </div>

                <div class="col-md-6 col-lg-3">

                    <div class="dashboard-card">

                        <h3 id="pagosConfirmados">0</h3>

                        <p>Pagos confirmados</p>

                    </div>

                </div>

                <div class="col-md-6 col-lg-3">

                    <div class="dashboard-card">

                        <h3 id="pagosPendientes">0</h3>

                        <p>Pagos pendientes</p>

                    </div>

                </div>

                <div class="col-md-6 col-lg-3">

                    <div class="dashboard-card">

                        <h3 id="totalCompras">0</h3>

<p>Compras de Preventa</p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
</body>

</html>
