<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Compras de Preventa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="topbar">

    <div class="container topbar-content">

        <img src="../assets/images/Color_Horizontal.png" class="logo">

        <div class="event-info">

            <h2>Pink Pony Club Party</h2>
            <p>Primer aniversario</p>

        </div>

    </div>

</header>

<main class="container-fluid mt-4">

    <div class="row">

        <!-- MENÚ -->

        <div class="col-lg-3">

            <div class="menu-card">

                <h4>Menú</h4>

                <a href="dashboard.html" class="menu-btn">
                    📊 Dashboard
                </a>

                <a href="boletos.html" class="menu-btn active">
                    💳 Compras de Preventa
                </a>

                <a href="scanner.html" class="menu-btn">
                    📷 Check-In
                </a>

                <a href="#" class="menu-btn">
                    📈 Reportes
                </a>

                <a href="#" class="menu-btn">
                    ⚙ Configuración
                </a>

            </div>

        </div>

        <!-- CONTENIDO -->

        <div class="col-lg-9">

            <h2 class="mb-4">
                Compras de Preventa
            </h2>

            <input
    id="buscador"
    class="form-control mb-4"
    type="text"
    placeholder="🔍 Buscar comprador, teléfono, Instagram o ID..."
>

            <div class="card shadow-sm border-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead>

                            <tr>

                                <th>Estado</th>
                                <th>Comprador</th>
                                <th>Teléfono</th>
                                <th>Boletos</th>
                                <th>Instagram</th>
                                <th class="text-end">Acción</th>

                            </tr>

                        </thead>

                        <tbody id="tablaCompras">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/boletos.js"></script>
